# YOLOv11 Data Augmentation Configuration
# 高精度训练数据增强策略
# 版本: 2.0

# ============================================================
# 空间变换
# ============================================================
fliplr: 0.5
flipud: 0.0
degrees: 10.0
translate: 0.15
scale: 0.5
shear: 5.0
perspective: 0.0

# ============================================================
# 颜色空间
# ============================================================
hsv_h: 0.015
hsv_s: 0.7
hsv_v: 0.4

# ============================================================
# 擦除与混合
# ============================================================
erasing: 0.4
mosaic: 1.0
mixup: 0.15
copy_paste: 0.0

# ============================================================
# 高级增强（高精度模式）
# ============================================================

# Cutout 随机擦除
cutout_prob: 0.5
cutout_ratio: 0.3

# AutoAugment 策略
# none | v0 | v0r | v1 | v1r | v2 | v3
auto_augment: v0r

# RandomErasing 参数
random_erasing_prob: 0.4
random_erasing_mode: pixel

# ============================================================
# 针对移动端场景的增强建议
# ============================================================
#
# [基础增强 - 必须开启]
# - fliplr: 0.5
# - mosaic: 1.0
# - hsv_s: 0.7
# - hsv_v: 0.4
#
# [高精度增强 - 推荐开启]
# - scale: 0.5
# - degrees: 10.0
# - translate: 0.15
# - mixup: 0.15
# - erasing: 0.4
#
# [数据量 < 1000 时]
# - mixup: 0.2-0.3
# - mosaic: 1.0
# - copy_paste: 0.1 (需要实例分割标注)
#
# [数据量 > 10000 时]
# - 可降低增强强度
# - mixup: 0.0-0.1
# - erasing: 0.2-0.3
