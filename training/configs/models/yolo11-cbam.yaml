# YOLO11 with CBAM Attention
# 在 Backbone 和 Head 中添加 CBAM 注意力机制
# 适用于: 小目标检测、复杂背景场景

nc: 80
scales:
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

# Backbone with CBAM
backbone:
  - [-1, 1, Conv, [64, 3, 2]]           # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]]          # 1-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]]
  - [-1, 1, Conv, [256, 3, 2]]          # 3-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]]
  - [-1, 1, CBAM, [512]]                # 5-CBAM Attention
  - [-1, 1, Conv, [512, 3, 2]]          # 6-P4/16
  - [-1, 2, C3k2, [512, True]]
  - [-1, 1, CBAM, [512]]                # 8-CBAM Attention
  - [-1, 1, Conv, [1024, 3, 2]]         # 9-P5/32
  - [-1, 2, C3k2, [1024, True]]
  - [-1, 1, CBAM, [1024]]               # 11-CBAM Attention
  - [-1, 1, SPPF, [1024, 5]]            # 12
  - [-1, 2, C2PSA, [1024]]              # 13

# Head with CBAM
head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 8], 1, Concat, [1]]           # cat backbone P4
  - [-1, 2, C3k2, [512, False]]         # 16

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 4], 1, Concat, [1]]           # cat backbone P3
  - [-1, 2, C3k2, [256, False]]         # 19 (P3/8-small)
  - [-1, 1, CBAM, [256]]                # 20-CBAM

  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 16], 1, Concat, [1]]          # cat head P4
  - [-1, 2, C3k2, [512, False]]         # 23 (P4/16-medium)
  - [-1, 1, CBAM, [512]]                # 24-CBAM

  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 13], 1, Concat, [1]]          # cat head P5
  - [-1, 2, C3k2, [1024, True]]         # 27 (P5/32-large)
  - [-1, 1, CBAM, [1024]]               # 28-CBAM

  - [[20, 24, 28], 1, Detect, [nc]]     # Detect(P3, P4, P5)
