# YOLO11 Enhanced - 综合改进版本
# 结合多种优化技术:
# - CBAM 注意力机制
# - C2fCIB 结构
# - 增强的 SPPF
# 适用于: 高精度检测(牺牲少量速度换取精度)

nc: 80
scales:
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

# Enhanced Backbone
backbone:
  - [-1, 1, Conv, [64, 3, 2]]           # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]]          # 1-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]]
  - [-1, 1, CBAM, [256]]                # 3-CBAM
  - [-1, 1, Conv, [256, 3, 2]]          # 4-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]]
  - [-1, 1, CBAM, [512]]                # 6-CBAM
  - [-1, 1, Conv, [512, 3, 2]]          # 7-P4/16
  - [-1, 2, C2fCIB, [512, True]]        # 8-C2fCIB (增强特征提取)
  - [-1, 1, CBAM, [512]]                # 9-CBAM
  - [-1, 1, Conv, [1024, 3, 2]]         # 10-P5/32
  - [-1, 2, C2fCIB, [1024, True]]       # 11-C2fCIB
  - [-1, 1, CBAM, [1024]]               # 12-CBAM
  - [-1, 1, SPPF, [1024, 5]]            # 13
  - [-1, 2, C2PSA, [1024]]              # 14

# Enhanced Head
head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 9], 1, Concat, [1]]           # cat backbone P4
  - [-1, 2, C3k2, [512, False]]         # 17

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 5], 1, Concat, [1]]           # cat backbone P3
  - [-1, 2, C3k2, [256, False]]         # 20 (P3/8-small)
  - [-1, 1, CBAM, [256]]                # 21-CBAM

  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 17], 1, Concat, [1]]          # cat head P4
  - [-1, 2, C3k2, [512, False]]         # 24 (P4/16-medium)
  - [-1, 1, CBAM, [512]]                # 25-CBAM

  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 14], 1, Concat, [1]]          # cat head P5
  - [-1, 2, C3k2, [1024, True]]         # 28 (P5/32-large)
  - [-1, 1, CBAM, [1024]]               # 29-CBAM

  - [[21, 25, 29], 1, Detect, [nc]]     # Detect(P3, P4, P5)
